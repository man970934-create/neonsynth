<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Neon Synth Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-screen" class="screen active">
    <h1>Neon Synth</h1>
    <p class="subtitle">Advanced Arcade Synth</p>
    <div class="portrait-hint" id="portrait-hint">💡 Поверните телефон горизонтально для удобной игры</div>
    <button id="start-btn">START</button>
  </div>

  <div id="main-screen" class="screen">
    <div class="portrait-hint" id="portrait-hint-main">💡 Для удобства поверните телефон горизонтально</div>

    <div class="hud">
      <div class="hud-left">
        <div class="hud-item"><span class="hud-label">Score</span><span id="score" class="hud-value">0</span></div>
        <div class="hud-item"><span class="hud-label">Level</span><span id="level" class="hud-value">1</span></div>
        <div class="hud-item"><span class="hud-label">Streak</span><span id="streak" class="hud-value">0</span></div>
      </div>
      <div class="hud-center">
        <div class="target-panel">
          <div class="target-label">Target</div>
          <div id="target-display" class="target-value">Free Play</div>
          <div id="target-steps" class="target-steps"></div>
        </div>
      </div>
      <div class="hud-right">
        <span id="mode-badge" class="mode-badge">Free Play</span>
      </div>
    </div>

    <div class="game-buttons">
      <button id="new-melody-btn">New Melody</button>
      <button id="play-melody-btn">Play Melody</button>
      <button id="reset-score-btn">Reset Score</button>
      <button id="reset-level-btn">Reset Level</button>
      <button id="toggle-controls-btn">⚙️ Settings</button>
    </div>

    <div id="controls-panel" class="controls hidden">
      <div class="control-group"><label>Instrument</label><select id="preset"><option value="neon">Neon Synth</option><option value="piano">Classic Piano</option><option value="pad">Soft Pad</option><option value="bass">Bass</option><option value="lead">Lead</option></select></div>
      <div class="control-group"><label>Mode</label><select id="game-mode-select"><option value="free">Free Play</option><option value="melody">Melody</option><option value="chord">Chord</option></select></div>
      <div class="control-group"><label>Waveform</label><select id="waveform"><option value="sine">Sine</option><option value="square">Square</option><option value="sawtooth">Sawtooth</option><option value="triangle">Triangle</option></select></div>
      <div class="control-group"><label>Volume</label><input type="range" id="volume" min="0" max="1" step="0.05" value="0.5"></div>
      <div class="control-group"><label>Attack</label><input type="range" id="attack" min="0.001" max="1" step="0.01" value="0.05"></div>
      <div class="control-group"><label>Release</label><input type="range" id="release" min="0.01" max="2" step="0.01" value="0.3"></div>
      <div class="control-group"><label>Sustain</label><input type="range" id="sustain" min="0" max="1" step="0.05" value="0.7"></div>
      <div class="control-group"><label>Cutoff</label><input type="range" id="filter-cutoff" min="100" max="20000" step="100" value="8000"></div>
      <div class="control-group"><label>Resonance</label><input type="range" id="resonance" min="0.1" max="20" step="0.1" value="1"></div>
      <div class="control-group"><label>Delay</label><input type="range" id="delay-amount" min="0" max="1" step="0.05" value="0.2"></div>
      <div class="control-group"><label>Reverb</label><input type="range" id="reverb-amount" min="0" max="1" step="0.05" value="0.3"></div>
      <div class="control-group"><label>Keys Scale</label><input type="range" id="keyboard-scale" min="60" max="140" step="10" value="100"></div>
    </div>

    <div class="keyboard-wrapper">
      <div id="keyboard" class="keyboard"></div>
    </div>
    <div class="kb-hint">Keyboard: A W S E D F T G Y H U J (Octave 4)</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
